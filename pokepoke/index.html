<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ポケモン比較ツール</title>
  </head>
  <body>
    <div id="app">
      <h1>ポケモン比較ツール</h1>

      <div class="search-area">
        <input type="text" id="pokemon1-input" placeholder="ポケモン1 (例: pikachu)">
        <input type="text" id="pokemon2-input" placeholder="ポケモン2 (例: pikachu)">

        <button type="button" id="compare-btn">比較する</button>
        <a href="https://wiki.pokemonwiki.com/wiki/%e3%83%9d%e3%82%b1%e3%83%a2%e3%83%b3%e3%81%ae%e5%a4%96%e5%9b%bd%e8%aa%9e%e5%90%8d%e4%b8%80%e8%a6%a7" target="_blank">ポケモンの外国語名一覧</a>
      </div>

      <div class="result-container">
        <div id="result-1"></div>
        <div id="result-2"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
